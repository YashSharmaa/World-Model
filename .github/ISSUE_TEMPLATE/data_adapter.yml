# ─────────────────────────────────────────────────────────────────────────────
#  GPU-Center World Model — new data-adapter request (issue FORM, not free text)
#  Author: Yash Sharma · https://www.linkedin.com/in/yashsharmaa/
#  License: Apache-2.0
#
#  The ingest layer normalizes real sources (Kueue, Kubernetes, DCGM,
#  node_exporter, Redfish, OTel/Prom) into one canonical entity-and-event
#  schema. This form scopes a new adapter and how it maps to that schema.
# ─────────────────────────────────────────────────────────────────────────────
name: "New data-adapter request"
description: "Request (or propose) an ingestion adapter for a new control-plane or telemetry source."
title: "[adapter]: "
labels: ["kind/feature", "area/ingest"]
body:
  - type: markdown
    attributes:
      value: |
        The ingest layer normalizes real sources into **one canonical
        entity-and-event schema**. Kueue is the primary scheduler adapter;
        Kubernetes DRA stays optional behind a flag. Please describe the source
        and how it maps onto the canonical world state.

  - type: input
    id: source
    attributes:
      label: Source system
      description: Name + version of the system to ingest from.
      placeholder: "Slurm 24.x / Volcano / NVIDIA DCGM 4.x / Redfish 1.x"
    validations:
      required: true

  - type: dropdown
    id: source-kind
    attributes:
      label: Source kind
      options:
        - "Scheduler / control plane (queues, admission, quota)"
        - "GPU telemetry (per-device utilization, thermal, power)"
        - "Host / node telemetry (sensors, exporters)"
        - "Out-of-band inventory / power / thermal (Redfish-like)"
        - "Observability backbone (OpenTelemetry / Prometheus)"
        - "Other"
    validations:
      required: true

  - type: input
    id: interface
    attributes:
      label: Machine-readable interface
      description: API/exporter/metrics endpoint or file format the adapter would read.
      placeholder: "Prometheus exposition / REST API / JSON snapshots / Parquet"
    validations:
      required: true

  - type: textarea
    id: mapping
    attributes:
      label: Mapping to canonical schema
      description: >-
        How do this source's fields map onto canonical entities (workloads,
        queues, nodes, GPUs, racks, topology domains, headroom signals) and
        units? Note anything that has no clean mapping.
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Sample payload (redacted)
      description: A tiny redacted record so we can design the normalizer + a fixture.
      render: json
    validations:
      required: false

  - type: dropdown
    id: licensing
    attributes:
      label: Sample-data licensing
      description: Any committed fixture/pack must carry clean provenance.
      options:
        - "Synthetic / I can author a synthetic fixture"
        - "I can share a redacted sample under CDLA-Permissive-2.0"
        - "Proprietary — cannot share data (adapter code only)"
        - "Unsure"
    validations:
      required: true

  - type: checkboxes
    id: offer
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement and/or test this adapter.
          required: false
