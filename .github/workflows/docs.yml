# ─────────────────────────────────────────────────────────────────────────────
#  GPU-Center World Model — documentation build
#  Author: Yash Sharma · https://www.linkedin.com/in/yashsharmaa/
#  License: Apache-2.0
#
#  Builds the MkDocs (Material) site in strict mode so broken links and missing
#  card sections fail the build, per design doc H ("Docs: fail build on broken
#  links and missing card sections"). On pushes to main the built site is
#  published to GitHub Pages; on pull requests it is built only (no deploy).
#  Actions are pinned by major version.
# ─────────────────────────────────────────────────────────────────────────────
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build docs (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # The dev extra carries mkdocs-material. Install the package so any
      # source-derived docs (API reference) can import the package cleanly.
      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # mkdocs.yml may not exist yet on early branches; degrade gracefully so
      # this workflow never breaks the contributor experience before the docs
      # site lands. Once mkdocs.yml is present this becomes a strict build.
      - name: Build site (strict)
        run: |
          if [ -f mkdocs.yml ]; then
            mkdocs build --strict
          else
            echo "::notice::mkdocs.yml not found yet — skipping docs build."
          fi

      - name: Upload built site
        if: github.event_name == 'pull_request' && hashFiles('mkdocs.yml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: site/
          if-no-files-found: ignore

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build site (strict)
        id: mkdocs
        run: |
          if [ -f mkdocs.yml ]; then
            mkdocs build --strict
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::notice::mkdocs.yml not found yet — nothing to deploy."
          fi

      - name: Upload Pages artifact
        if: steps.mkdocs.outputs.built == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.mkdocs.outputs.built == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
