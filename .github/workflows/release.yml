# ─────────────────────────────────────────────────────────────────────────────
#  GPU-Center World Model — release automation
#  Author: Yash Sharma · https://www.linkedin.com/in/yashsharmaa/
#  License: Apache-2.0
#
#  Triggered on a `v*` tag (or manual dispatch). Per design doc H ("Release
#  automation"): gate on a green build, publish release assets outside Git
#  history, generate an SBOM, attest build provenance for the released wheel,
#  and attach the cards/SBOM/provenance artifacts to the GitHub Release.
#
#  Zenodo DOI archival is handled by the Zenodo↔GitHub integration that reacts
#  to the published Release and consumes CITATION.cff; no extra job is needed.
#  Actions are pinned by major version.
# ─────────────────────────────────────────────────────────────────────────────
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build a release for (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build distributions + SBOM
    runs-on: ubuntu-24.04
    outputs:
      wheel-hash: ${{ steps.hash.outputs.wheel-hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build + SBOM tooling
        run: |
          python -m pip install --upgrade pip
          # Pin the CycloneDX generator (doc H "Generate an SBOM for release
          # artifacts"). Pinning keeps the SBOM tool itself reproducible so the
          # released bill-of-materials does not silently change format/version
          # between releases.
          python -m pip install "build==1.2.2.post1" "cyclonedx-bom==5.1.1"

      - name: Build wheel + sdist
        run: python -m build

      # Install the freshly built package into an isolated env so the SBOM
      # reflects the actual released dependency closure.
      - name: Install built wheel for SBOM
        run: python -m pip install dist/*.whl

      # Generate the CycloneDX SBOM for the released dependency closure. The
      # invocation is pinned to the documented `cyclonedx-py environment`
      # subcommand (cyclonedx-bom 5.x) and NO LONGER swallows failure with
      # `|| echo` — an SBOM is a release-blocking artifact, so a generation
      # failure must FAIL the job rather than ship a release with no bill of
      # materials.
      - name: Generate SBOM (CycloneDX)
        run: |
          python -m cyclonedx_py environment \
            --output-format JSON \
            --outfile dist/sbom.cdx.json

      # Prove the SBOM is a real, non-empty CycloneDX document before it is
      # uploaded — a zero-byte or malformed file would otherwise pass silently.
      - name: Verify SBOM is a valid CycloneDX document
        run: |
          test -s dist/sbom.cdx.json
          python - <<'PY'
          import json, sys
          doc = json.load(open("dist/sbom.cdx.json"))
          fmt = doc.get("bomFormat")
          comps = doc.get("components", [])
          if fmt != "CycloneDX":
              sys.exit(f"sbom.cdx.json bomFormat={fmt!r}, expected 'CycloneDX'")
          if not comps:
              sys.exit("sbom.cdx.json has no components — empty bill of materials")
          print(f"SBOM OK: CycloneDX spec {doc.get('specVersion')}, "
                f"{len(comps)} components.")
          PY

      - name: Compute wheel hash
        id: hash
        run: |
          cd dist
          echo "wheel-hash=$(sha256sum ./*.whl | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  attest:
    name: attest build provenance
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist

      # Best-effort SLSA-style provenance for the released wheel/sdist.
      - name: Attest artifacts
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        continue-on-error: true
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

  publish:
    name: publish GitHub Release
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist

      # The SBOM is a required release asset (doc H "Attach evaluation, cards,
      # SBOM, and provenance artifacts to the GitHub release"). Verify it actually
      # arrived from the build job and is a valid CycloneDX document before we cut
      # the Release — a missing SBOM must FAIL the publish, not ship silently.
      - name: Verify SBOM is present and valid
        run: |
          test -s dist/sbom.cdx.json || {
            echo "::error::dist/sbom.cdx.json is missing or empty — refusing to publish a release without a bill of materials."
            exit 1
          }
          python - <<'PY'
          import json, sys
          doc = json.load(open("dist/sbom.cdx.json"))
          if doc.get("bomFormat") != "CycloneDX" or not doc.get("components"):
              sys.exit("dist/sbom.cdx.json is not a valid non-empty CycloneDX SBOM")
          print(f"SBOM verified for release: {len(doc['components'])} components.")
          PY

      # Attach distributions, the SBOM, and model/data cards so the Release is
      # self-describing and citable. Cards are markdown under docs/cards.
      - name: Collect release assets (dist + SBOM + cards)
        run: |
          mkdir -p release-assets
          cp -v dist/* release-assets/ 2>/dev/null || true
          # Attach the SBOM explicitly (it is already in dist/*, but name it as a
          # first-class, expected asset so the release is auditable).
          cp -v dist/sbom.cdx.json release-assets/sbom.cdx.json
          if [ -d docs/cards ]; then
            cp -v docs/cards/*.md release-assets/ 2>/dev/null || true
          fi
          cp -v CITATION.cff release-assets/ 2>/dev/null || true
          ls -la release-assets

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/*
