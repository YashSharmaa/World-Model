# ─────────────────────────────────────────────────────────────────────────────
#  GPU-Center World Model — supply-chain security
#  Author: Yash Sharma · https://www.linkedin.com/in/yashsharmaa/
#  License: Apache-2.0
#
#  Two best-effort tracks per design doc H ("Supply-chain checks"):
#    * OpenSSF Scorecard — automated OSS security-risk checks, uploaded to the
#      code-scanning dashboard. Best-effort: it needs repo settings that may not
#      be live on a fork, so it never blocks the merge gate.
#    * pip-audit — scans the resolved dependency closure for known CVEs.
#
#  Both jobs are continue-on-error so a transient advisory-feed hiccup cannot
#  break contributor PRs. Actions are pinned by major version.
# ─────────────────────────────────────────────────────────────────────────────
name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday sweep so newly disclosed CVEs surface without a push.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: scorecard-results.sarif
          retention-days: 5
          if-no-files-found: ignore

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841 # v3.28.13
        with:
          sarif_file: scorecard-results.sarif

  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[serve,data]"
          python -m pip install pip-audit

      # Audit the installed environment (the package plus its resolved deps).
      - name: Audit dependency closure
        run: pip-audit --strict --progress-spinner off

  # ───────────────────────────────────────────────────────────────────────────
  # REUSE / SPDX license hygiene (doc H "Adopt REUSE and SPDX headers from day
  # one"). Code, docs, and released data intentionally carry DIFFERENT licenses
  # (Apache-2.0 / CC-BY-4.0 / CDLA-Permissive-2.0); `reuse lint` proves every file
  # has a machine-readable, unambiguous license and that every referenced license
  # text exists under LICENSES/ (the three SPDX texts are committed there).
  #
  # Best-effort like the sibling supply-chain jobs: a stray un-headed file (e.g. a
  # freshly added gitignore) surfaces in the log without blocking a contributor's
  # PR while the source tree is still converging on full per-file SPDX coverage.
  # ───────────────────────────────────────────────────────────────────────────
  reuse:
    name: REUSE / SPDX license lint
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install REUSE tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install "reuse>=4.0"

      # `reuse lint` reads REUSE.toml + per-file SPDX headers and fails if any
      # file is missing a license, any declared license text is absent from
      # LICENSES/, or any LICENSES/ text is unused. This is the doc-H license
      # hygiene gate.
      - name: REUSE lint
        run: reuse lint
