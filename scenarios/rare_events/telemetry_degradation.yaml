#
# telemetry_degradation — channels dropped/staled during an incident (doc D).
#
# Selected metric channels are dropped, staled, or delayed — because real
# failures often corrupt observability, not just performance. Missingness is
# modelled as STATE (a signal), never imputed to zero (schema observations.py /
# state.py M_t). The pre-state degrades source health for the GPU telemetry
# family so the abstention / observation-integrity gate (policy.AbstentionConfig)
# is exercised: the model should raise uncertainty and abstain or fall back.

scenario_id: telemetry_degradation
scenario_family: rare_events
seed: 3007
base_ts: 0.0
tick: 0

context:
  regime: incident
  ambient_temp_c: 24.0
  arrival_burst_regime: steady
  workload_mix_regime: mixed

pod:
  block_id: block-0
  flavor: gpu-h100
  gpus_per_node: 8
  racks:
    - id: rack-a
      nodes: 4
      gpus_per_node: 8
      power_domain: pdu-a
      cooling_zone: zone-row-0
      switch: tor-a
    - id: rack-b
      nodes: 4
      gpus_per_node: 8
      power_domain: pdu-b
      cooling_zone: zone-row-0
      switch: tor-b

flavors:
  - name: gpu-h100
    topology: block-0

cluster_queues:
  - name: cq-research
    flavor_order: [gpu-h100]
    nominal_quota:
      gpu-h100:
        nvidia.com/gpu: 48.0

local_queues:
  - name: lq-team
    namespace: team
    cluster_queue: cq-research
    tenant_id: tenant-team

jobs:
  - uid: wl-run-train
    local_queue: lq-team
    status: running
    place_on: rack-a
    priority: 50
    gpus: 8
    replicas: 1
    comm_class: allreduce_heavy
    est_remaining_s: 6000.0
    max_exec_s: 14400.0
    labels: {class: training}
  - uid: wl-train-008
    local_queue: lq-team
    priority: 30
    gpus: 8
    replicas: 1
    comm_class: allreduce_heavy
    topology_policy: required
    max_exec_s: 14400.0
    labels: {class: training}
  - uid: wl-infer-001
    local_queue: lq-team
    priority: 10
    gpus: 1
    replicas: 1
    topology_policy: unconstrained
    max_exec_s: 1800.0
    labels: {class: inference}

# Degrade GPU + node/rack telemetry: stale, partly missing, delayed.
rare_event:
  kind: telemetry_degradation
  severity: 0.7                 # high missing probability + large staleness
  onset_s: 0.0
  channels:
    - gpu_telemetry
    - node_rack_telemetry

operator_policy:
  policy_id: incident
  allowed_actions: [hold, admit, place, admit_and_place]
  risk_thresholds:
    max_hotspot_prob: 0.08
