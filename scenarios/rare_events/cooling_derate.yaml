#
# cooling_derate — a shared cooling-zone capacity reduction (doc D rare event).
#
# One cooling zone loses capacity / sees raised inlet temperature. This is a
# shared zone-level perturbation, not a per-GPU spike: thermal inertia and rack
# coupling produce *delayed* hotspot emergence across every rack on the zone.
# The pre-state derates the zone's margin and lifts inlet temp; the simulator
# evolves the lagged thermal trajectory from the shared seed.

scenario_id: cooling_derate
scenario_family: rare_events
seed: 3002
base_ts: 0.0
tick: 0

context:
  regime: incident
  ambient_temp_c: 26.0
  arrival_burst_regime: steady
  workload_mix_regime: training_heavy

pod:
  block_id: block-0
  flavor: gpu-h100
  gpus_per_node: 8
  racks:
    - id: rack-a
      nodes: 4
      gpus_per_node: 8
      power_domain: pdu-a
      cooling_zone: zone-derated
      switch: tor-a
      thermal_margin_c: 10.0
    - id: rack-b
      nodes: 4
      gpus_per_node: 8
      power_domain: pdu-b
      cooling_zone: zone-derated      # both racks share the failing zone
      switch: tor-b
      thermal_margin_c: 10.0

flavors:
  - name: gpu-h100
    topology: block-0

cluster_queues:
  - name: cq-research
    flavor_order: [gpu-h100]
    nominal_quota:
      gpu-h100:
        nvidia.com/gpu: 48.0

local_queues:
  - name: lq-team
    namespace: team
    cluster_queue: cq-research
    tenant_id: tenant-team

jobs:
  - uid: wl-run-train-a
    local_queue: lq-team
    status: running
    place_on: rack-a
    priority: 50
    gpus: 8
    replicas: 1
    comm_class: allreduce_heavy
    est_remaining_s: 5400.0
    max_exec_s: 14400.0
    labels: {class: training}
  - uid: wl-train-008
    local_queue: lq-team
    priority: 30
    gpus: 8
    replicas: 1
    comm_class: allreduce_heavy
    topology_policy: required
    max_exec_s: 14400.0
    labels: {class: training}
  - uid: wl-finetune-004
    local_queue: lq-team
    priority: 20
    gpus: 4
    replicas: 1
    comm_class: light
    topology_policy: preferred
    max_exec_s: 5400.0
    labels: {class: fine_tune}

rare_event:
  kind: cooling_derate
  severity: 0.5               # halve the zone's cooling margin, +3C inlet
  onset_s: 0.0
  targets:
    - zone-derated

operator_policy:
  policy_id: incident
  allowed_actions: [hold, admit, place, admit_and_place]
  risk_thresholds:
    max_hotspot_prob: 0.08
    max_headroom_violation_prob: 0.04
