#
# gpu_fault_burst — Xid-linked degradation / reset episode (doc D rare event).
#
# A small set of GPUs goes intermittently faulty (Xid 79: "GPU has fallen off
# the bus"), propagating into degraded availability, slowdowns, or requeues. The
# pre-action state marks the seed GPUs faulty so the health mask and reliability
# filter start from a reproducible point; the simulator schedules the burst's
# evolution from `onset_s` using the shared seed. Use DCGM error-injection /
# Xid categories as the semantic vocabulary, never one-channel cartoon spikes.

scenario_id: gpu_fault_burst
scenario_family: rare_events
seed: 3001
base_ts: 0.0
tick: 0

context:
  regime: incident
  ambient_temp_c: 23.0
  arrival_burst_regime: steady
  workload_mix_regime: mixed

pod:
  block_id: block-0
  flavor: gpu-h100
  gpus_per_node: 8
  gpu_memory_mb: 81920
  racks:
    - id: rack-a
      nodes: 4
      gpus_per_node: 8
      power_domain: pdu-a
      cooling_zone: zone-row-0
      switch: tor-a
    - id: rack-b
      nodes: 4
      gpus_per_node: 8
      power_domain: pdu-b
      cooling_zone: zone-row-0
      switch: tor-b

flavors:
  - name: gpu-h100
    topology: block-0

cluster_queues:
  - name: cq-research
    flavor_order: [gpu-h100]
    nominal_quota:
      gpu-h100:
        nvidia.com/gpu: 48.0

local_queues:
  - name: lq-team
    namespace: team
    cluster_queue: cq-research
    tenant_id: tenant-team

jobs:
  - uid: wl-run-train
    local_queue: lq-team
    status: running
    place_on: rack-a
    priority: 50
    gpus: 8
    replicas: 1
    comm_class: allreduce_heavy
    est_remaining_s: 7200.0
    max_exec_s: 14400.0
    labels: {class: training}
  - uid: wl-train-016
    local_queue: lq-team
    priority: 40
    gpus: 16
    replicas: 2
    comm_class: allreduce_heavy
    topology_policy: required
    max_exec_s: 21600.0
    labels: {class: training}
  - uid: wl-infer-001
    local_queue: lq-team
    priority: 10
    gpus: 1
    replicas: 1
    comm_class: none
    topology_policy: unconstrained
    max_exec_s: 1800.0
    labels: {class: inference}

# Rare-event injection: seed two GPUs on the running gang's rack as faulty.
rare_event:
  kind: gpu_fault_burst
  severity: 0.7
  onset_s: 0.0                 # already faulty at t0 (visible in the pre-state)
  count: 2
  xid_code: 79                 # GPU has fallen off the bus
  targets:
    - rack-a-node-0-gpu-0
    - rack-a-node-1-gpu-3

operator_policy:
  policy_id: incident
  allowed_actions: [hold, admit, place, admit_and_place]
  risk_thresholds:
    max_xid_fault_prob: 0.05
    max_requeue_prob: 0.10
