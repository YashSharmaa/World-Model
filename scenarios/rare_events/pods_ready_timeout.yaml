#
# pods_ready_timeout — admission-to-ready failure / failed scale-up (doc D).
#
# After admission, pods fail to become ready within Kueue's `waitForPodsReady`
# timeout, triggering eviction and requeue. The decision-time state is nominal:
# the hazard is in the *future under the admit action*, so the model must predict
# a high PodsReadyTimeout hazard rather than read it from the current state. The
# event params carry the readiness-stall mechanics for the simulator to enact.

scenario_id: pods_ready_timeout
scenario_family: rare_events
seed: 3003
base_ts: 0.0
tick: 0

context:
  regime: normal
  ambient_temp_c: 23.0
  arrival_burst_regime: steady
  workload_mix_regime: mixed

pod:
  block_id: block-0
  flavor: gpu-h100
  gpus_per_node: 8
  racks:
    - id: rack-a
      nodes: 4
      gpus_per_node: 8
      power_domain: pdu-a
      cooling_zone: zone-row-0
      switch: tor-a
    - id: rack-b
      nodes: 4
      gpus_per_node: 8
      power_domain: pdu-b
      cooling_zone: zone-row-0
      switch: tor-b

flavors:
  - name: gpu-h100
    topology: block-0

cluster_queues:
  - name: cq-research
    flavor_order: [gpu-h100]
    nominal_quota:
      gpu-h100:
        nvidia.com/gpu: 48.0

local_queues:
  - name: lq-team
    namespace: team
    cluster_queue: cq-research
    tenant_id: tenant-team

jobs:
  - uid: wl-train-016
    local_queue: lq-team
    priority: 40
    gpus: 16
    replicas: 2
    comm_class: allreduce_heavy
    topology_policy: required
    max_exec_s: 21600.0
    labels: {class: training, image: large-cuda-image}
  - uid: wl-finetune-004
    local_queue: lq-team
    priority: 20
    gpus: 4
    replicas: 1
    comm_class: light
    topology_policy: preferred
    max_exec_s: 5400.0
    labels: {class: fine_tune}

rare_event:
  kind: pods_ready_timeout
  severity: 0.8
  onset_s: 120.0                 # readiness stall begins after admission
  targets:
    - wl-train-016               # the gang that will fail to scale up
  # Kueue-style readiness mechanics consumed by the simulator:
  wait_for_pods_ready_s: 300.0   # eviction timeout
  ready_stall_fraction: 0.5      # fraction of pods that never become ready
  eviction_reason: PodsReadyTimeout

operator_policy:
  policy_id: default
  allowed_actions: [hold, admit, place, admit_and_place]
  risk_thresholds:
    max_pods_ready_timeout_prob: 0.10
    max_requeue_prob: 0.10
