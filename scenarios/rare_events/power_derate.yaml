#
# power_derate — rack / power-domain budget reduction or cap (doc D rare event).
#
# A power domain's budget is cut (e.g. a PDU phase fault or a facility cap). The
# effect propagates to rack headroom, performance, and completion-time deltas —
# tied to workload-aware power profiles, not a static penalty factor. The
# pre-state lowers the domain cap and raises violation risk; the simulator
# couples the cap to both thermal trajectories and completion-time distributions.

scenario_id: power_derate
scenario_family: rare_events
seed: 3004
base_ts: 0.0
tick: 0

context:
  regime: incident
  ambient_temp_c: 24.0
  arrival_burst_regime: steady
  workload_mix_regime: training_heavy

pod:
  block_id: block-0
  flavor: gpu-h100
  gpus_per_node: 8
  racks:
    - id: rack-a
      nodes: 4
      gpus_per_node: 8
      power_domain: pdu-derated
      cooling_zone: zone-row-0
      switch: tor-a
      power_cap_kw: 120.0
    - id: rack-b
      nodes: 4
      gpus_per_node: 8
      power_domain: pdu-b
      cooling_zone: zone-row-0
      switch: tor-b
      power_cap_kw: 120.0

flavors:
  - name: gpu-h100
    topology: block-0

cluster_queues:
  - name: cq-research
    flavor_order: [gpu-h100]
    nominal_quota:
      gpu-h100:
        nvidia.com/gpu: 48.0

local_queues:
  - name: lq-team
    namespace: team
    cluster_queue: cq-research
    tenant_id: tenant-team

jobs:
  - uid: wl-run-train-a
    local_queue: lq-team
    status: running
    place_on: rack-a
    priority: 50
    gpus: 16
    replicas: 2
    comm_class: allreduce_heavy
    est_remaining_s: 7200.0
    max_exec_s: 21600.0
    labels: {class: training}
  - uid: wl-train-008
    local_queue: lq-team
    priority: 30
    gpus: 8
    replicas: 1
    comm_class: allreduce_heavy
    topology_policy: required
    max_exec_s: 14400.0
    labels: {class: training}
  - uid: wl-infer-001
    local_queue: lq-team
    priority: 10
    gpus: 1
    replicas: 1
    topology_policy: unconstrained
    max_exec_s: 1800.0
    labels: {class: inference}

rare_event:
  kind: power_derate
  severity: 0.3                 # cut the derated domain's cap by 30%
  onset_s: 0.0
  targets:
    - pdu-derated

operator_policy:
  policy_id: incident
  allowed_actions: [hold, admit, place, admit_and_place]
  risk_thresholds:
    max_headroom_violation_prob: 0.05
